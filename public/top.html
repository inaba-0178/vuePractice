<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランディングページ</title>
  <link rel="stylesheet" href="/top.css">
</head>
<body>

  <header class="header-nav">
    <a href="#">中古車</a>
    <a href="#">輸入車</a>
    <a href="#">中古車販売店</a>
  </header>

  <main>
    <section class="hero">
      <h1>ランディングページのタイトル</h1>
      <p>サイトの内容や情報を伝え、続きへ誘導したくさせるサブ説明文...</p>
      <div class="hero-image"></div>
    </section>

    <section class="search-section">
      <h2>中古車を探す</h2>
      <div class="brand-grid">
        <div class="brand-item">
          <img src="placeholder.png" alt="レクサス">
          <p>レクサス</p>
        </div>
        <div class="brand-item">
          <img src="placeholder.png" alt="トヨタ">
          <p>トヨタ</p>
        </div>
        <div class="brand-item">
          <img src="placeholder.png" alt="ホンダ">
          <p>ホンダ</p>
        </div>
        <div class="brand-item">
          <img src="placeholder.png" alt="日産">
          <p>日産</p>
        </div>
        <!-- 必要に応じて続けて追加 -->
      </div>
    </section>

    <section class="search-section">
      <h2>輸入中古車を探す</h2>
      <div class="brand-grid">
        <div class="brand-item">
          <img src="placeholder.png" alt="メルセデス・ベンツ">
          <p>メルセデス・ベンツ</p>
        </div>
        <div class="brand-item">
          <img src="placeholder.png" alt="BMW">
          <p>BMW</p>
        </div>
        <div class="brand-item">
          <img src="placeholder.png" alt="フォルクスワーゲン">
          <p>フォルクスワーゲン</p>
        </div>
        <div class="brand-item">
          <img src="placeholder.png" alt="アウディ">
          <p>アウディ</p>
        </div>
      </div>
    </section>

    <section class="search-section">
      <h2>ボディタイプから検索</h2>
      <div class="type-grid">
        <div>軽自動車</div>
        <div>コンパクトカー</div>
        <div>ミニバン</div>
        <div>SUV・クロカン</div>
        <div>セダン</div>
        <div>クーペ</div>
        <div>トラック</div>
      </div>
    </section>

  </main>

</body>
</html>
